[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horseracing-sim"
version = "0.0.1"
description = "Horse race simulation in Python"
authors = [
    { name = "Mellophos" }
]
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "jsonschema",
    "pydantic",
    "python-statemachine",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]